<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Admin Dashboard</title>
    <style>
      :root {
        --bg: #08111f;
        --panel: #101b2d;
        --panel-2: #142338;
        --border: #263b57;
        --text: #e5edf7;
        --muted: #9bb0d1;
        --green: #22c55e;
        --yellow: #f9a825;
        --red: #ef4444;
        --blue: #60a5fa;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: linear-gradient(135deg, var(--bg), #0e1729 50%, #111827);
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .container {
        max-width: 1300px;
        padding: 24px;
        margin: 0 auto;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding: 18px 20px;
        background: rgba(16, 27, 45, 0.92);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .topbar h1 {
        margin: 0;
        font-size: 1.8rem;
      }
      .badge {
        padding: 8px 12px;
        border-radius: 12px;
        font-weight: bold;
        background: rgba(34, 197, 94, 0.12);
        border: 1px solid rgba(34, 197, 94, 0.4);
        color: #9ae6b4;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 24px;
      }
      .card {
        background: rgba(20, 35, 56, 0.95);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      }
      .card h2 {
        margin-top: 0;
        font-size: 1.25rem;
      }
      label {
        display: block;
        margin: 12px 0 8px;
        font-size: 0.95rem;
        color: var(--muted);
      }
      input, textarea, button, select {
        width: 100%;
        box-sizing: border-box;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #0b1524;
        color: var(--text);
        padding: 11px 12px;
        font-size: 1rem;
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      button {
        cursor: pointer;
        border: none;
        font-weight: bold;
        transition: 0.2s ease;
      }
      button:hover { opacity: 0.96; }
      .primary { background: linear-gradient(135deg, var(--green), #16a34a); }
      .warning { background: linear-gradient(135deg, var(--yellow), #f59e0b); color: #111827; }
      .danger { background: linear-gradient(135deg, var(--red), #b91c1c); }
      .secondary { background: linear-gradient(135deg, #3b82f6, #2563eb); }
      .row {
        display: flex;
        gap: 10px;
      }
      .row > * { flex: 1; }
      .status-box {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 12px;
        font-weight: bold;
        background: rgba(96, 165, 250, 0.12);
        border: 1px solid rgba(96, 165, 250, 0.4);
        color: var(--blue);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }
      th, td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th { color: var(--muted); font-weight: normal; }
      .muted { color: var(--muted); }
      .small { font-size: 0.8rem; }
      .member-list {
        max-height: 260px;
        overflow: auto;
      }
      .member-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
      }
      .pill {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.7rem;
        background: rgba(96,165,250,0.12);
        color: var(--blue);
      }
      .logout {
        color: var(--text);
        text-decoration: none;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
      }
      @media (max-width: 700px) {
        .topbar { flex-direction: column; gap: 12px; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <h1>WhatsApp Admin Dashboard</h1>
        <a href="/logout" class="logout">Logout</a>
      </div>

      <div class="grid">
        <div class="card">
          <h2>Bot Status</h2>
          <div class="status-box" id="connectionStatus">Loading...</div>
          <table>
            <thead>
              <tr>
                <th>Group</th>
                <th>Members</th>
              </tr>
            </thead>
            <tbody id="groupsTable"></tbody>
          </table>
        </div>

        <div class="card">
          <h2>Send Message</h2>
          <label>Group JID</label>
          <input id="groupId" placeholder="120363....@g.us" />
          <label>Message</label>
          <textarea id="messageText" placeholder="Type your message..."></textarea>
          <button id="sendBtn" class="primary">Send Message</button>
        </div>

        <div class="card">
          <h2>Moderation</h2>
          <label>Group JID</label>
          <input id="banGroupId" placeholder="120363....@g.us" />
          <label>User JID</label>
          <input id="userId" placeholder="2547....@s.whatsapp.net" />
          <div class="row">
            <button id="banBtn" class="danger">Ban User</button>
            <button id="unbanBtn" class="warning">Unban</button>
          </div>
        </div>
      </div>

      <div class="grid" style="margin-top: 24px;">
        <div class="card">
          <h2>Group Members</h2>
          <label>Group JID</label>
          <div class="row">
            <input id="memberGroupId" placeholder="120363....@g.us" />
            <button id="loadMembersBtn" class="secondary">Load Members</button>
          </div>
          <div id="membersList" class="member-list muted">No members loaded.</div>
        </div>

        <div class="card">
          <h2>Recent Logs</h2>
          <div id="logsList" class="muted">Loading logs...</div>
        </div>
      </div>
    </div>

    <script>
      async function loadStatus() {
        try {
          const response = await fetch('/api/status');
          const data = await response.json();
          const status = data.connection || 'offline';
          document.getElementById('connectionStatus').textContent = status;

          const groupsTable = document.getElementById('groupsTable');
          const groups = Array.isArray(data.groups) ? data.groups : [];
          groupsTable.innerHTML = groups.length
            ? groups.map(group => `<tr><td>${group}</td><td>Loaded</td></tr>`).join('')
            : '<tr><td colspan="2" class="muted">No groups loaded yet.</td></tr>';

          const logsList = document.getElementById('logsList');
          const logs = Array.isArray(data.logs) ? data.logs : [];
          logsList.innerHTML = logs.length
            ? logs.map(log => `<div><strong>${new Date(log.time).toLocaleString()}</strong><br>${log.message}</div><hr />`).join('')
            : '<div>No log entries yet.</div>';
        } catch (error) {
          document.getElementById('connectionStatus').textContent = 'offline';
          document.getElementById('logsList').innerHTML = '<div>Unable to load status.</div>';
        }
      }

      async function loadMembers() {
        const groupId = document.getElementById('memberGroupId').value.trim();
        if (!groupId) {
          document.getElementById('membersList').innerHTML = 'Please enter a group JID.';
          return;
        }

        try {
          const response = await fetch(`/api/members/${encodeURIComponent(groupId)}`);
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Failed to load members');
          }

          const members = data.members || [];
          document.getElementById('membersList').innerHTML = members.length
            ? members.map(member => `
              <div class="member-item">
                <div>
                  <strong>${member.id}</strong><br>
                  <span class="small muted">${member.admin || 'member'}</span>
                </div>
                <span class="pill">${member.admin ? 'Admin' : 'User'}</span>
              </div>
            `).join('')
            : '<div>No members found.</div>';
        } catch (error) {
          document.getElementById('membersList').innerHTML = `<div>${error.message}</div>`;
        }
      }

      document.getElementById('sendBtn').addEventListener('click', async () => {
        const groupId = document.getElementById('groupId').value.trim();
        const text = document.getElementById('messageText').value.trim();

        const response = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ groupId, text })
        });

        const data = await response.json();
        alert(data.error || data.message || 'Done');
        loadStatus();
      });

      document.getElementById('banBtn').addEventListener('click', async () => {
        const groupId = document.getElementById('banGroupId').value.trim();
        const userId = document.getElementById('userId').value.trim();

        const response = await fetch('/api/ban', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ groupId, userId })
        });

        const data = await response.json();
        alert(data.error || data.message || 'Done');
        loadStatus();
      });

      document.getElementById('unbanBtn').addEventListener('click', async () => {
        const userId = document.getElementById('userId').value.trim();

        const response = await fetch('/api/unban', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });

        const data = await response.json();
        alert(data.error || data.message || 'Done');
        loadStatus();
      });

      document.getElementById('loadMembersBtn').addEventListener('click', loadMembers);

      loadStatus();
      setInterval(loadStatus, 5000);
    </script>
  </body>
</html>
